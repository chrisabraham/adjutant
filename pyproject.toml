[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adjutant-cli"
dynamic = ["version"]
description = "A command-line chief of staff: Todoist tasks with a permanent history, minutes from plain sentences, briefs, and follow-through."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Chris Abraham" }]
keywords = ["todoist", "cli", "assistant", "productivity", "claude", "minutes"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
model = ["anthropic>=1.10"]

[project.scripts]
adj = "adjutant.cli:main"

[project.urls]
Homepage = "https://github.com/chrisabraham/adjutant"
"Sister project" = "https://github.com/chrisabraham/oversoul"

[tool.setuptools]
packages = ["adjutant"]

[tool.setuptools.dynamic]
version = { attr = "adjutant.__version__" }
